name: Build EndeavourOS pipa image

# Mirrors .circleci/config.yml, but runs on GitHub's free native aarch64
# runners so the image can be rebuilt without a CircleCI account, and so the
# result survives longer than CircleCI's 30-day artifact retention.

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: Desktop image to build
        type: choice
        options:
          - plasma
          - gnome
          - both
        default: plasma
      include_sensors:
        description: Include pipa sensor packages
        type: boolean
        default: true
      retention_days:
        description: Artifact retention in days (max 90)
        default: "90"

  # Uncomment to keep a fresh downloadable image around automatically, since
  # artifacts expire after retention_days.
  # schedule:
  #   - cron: "0 4 1 * *"

concurrency:
  group: pipa-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner details
        run: |
          uname -a
          docker version
          echo "cpus: $(nproc)"
          free -h
          echo '--- filesystems ---'
          df -hT
          echo '--- loop devices ---'
          ls -l /dev/loop-control /dev/loop0 2>/dev/null || echo 'no loop devices present yet'

      - name: Reclaim disk space
        run: |
          before=$(df -P --output=avail / | tail -1)
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc /usr/local/.ghcup \
            /usr/share/swift \
            /usr/local/share/powershell \
            /usr/local/lib/node_modules \
            /opt/hostedtoolcache || true
          sudo apt-get clean || true
          after=$(df -P --output=avail / | tail -1)
          echo "Reclaimed $(( (after - before) / 1024 / 1024 )) GiB on /"
          df -hT /

      - name: Choose scratch volume
        id: scratch
        run: |
          # build-image.sh keeps the pacstrapped rootfs tree, every raw image
          # and the final zip on disk simultaneously, so the build needs roughly
          # 25 GiB. The runner's root volume is usually smaller than that, so
          # put both Docker's layer store and the image output on whichever
          # mounted volume has the most free space.
          pick=/
          picked_avail=$(df -P --output=avail / | tail -1)
          for cand in /mnt /datadrive /opt; do
            [ -d "$cand" ] || continue
            avail=$(df -P --output=avail "$cand" | tail -1) || continue
            if [ "$avail" -gt "$picked_avail" ]; then
              pick="$cand"
              picked_avail="$avail"
            fi
          done
          root="${pick%/}/pipa-build"
          sudo mkdir -p "$root/docker" "$root/images"
          sudo chown -R "$(id -u):$(id -g)" "$root"
          gib=$(( picked_avail / 1024 / 1024 ))
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "Scratch root $root on $pick, ${gib} GiB available"
          if [ "$gib" -lt 25 ]; then
            echo "::warning::only ${gib} GiB available; the build may run out of space"
          fi

      - name: Move Docker data-root onto the scratch volume
        run: |
          # The rootfs tree is written inside the container's writable layer, so
          # the layer store is what actually has to fit, not just the bind mount.
          sudo systemctl stop docker docker.socket || true
          sudo mkdir -p /etc/docker
          printf '{\n  "data-root": "%s/docker"\n}\n' '${{ steps.scratch.outputs.root }}' \
            | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format 'data-root: {{.DockerRootDir}}'

      - name: Build the builder container
        run: docker build pipa-endeavouros-builder -t pipa-endeavouros-builder

      - name: Build image(s)
        run: |
          set -euo pipefail
          root='${{ steps.scratch.outputs.root }}'
          case '${{ inputs.desktop }}' in
            both) targets='plasma gnome' ;;
            *)    targets='${{ inputs.desktop }}' ;;
          esac
          sensors=1
          [ '${{ inputs.include_sensors }}' = 'true' ] || sensors=0
          for target in $targets; do
            echo "::group::build $target"
            docker run --rm --privileged \
              -v "$root/images:/build/images" \
              -v /dev:/dev \
              -e BUILD_GIT_REV="$GITHUB_SHA" \
              -e PIPA_INCLUDE_SENSORS="$sensors" \
              pipa-endeavouros-builder "$target"
            echo "::endgroup::"
            df -hT "$root"
          done

      - name: Summarize artifacts
        run: |
          root='${{ steps.scratch.outputs.root }}'
          ls -lh "$root/images"
          for zip in "$root/images"/*.zip; do
            [ -f "$zip" ] || continue
            echo "=== $zip ==="
            unzip -l "$zip"
            echo '--- SHA256SUMS ---'
            unzip -p "$zip" SHA256SUMS || true
            echo '--- BUILDINFO.txt ---'
            unzip -p "$zip" BUILDINFO.txt || true
          done

      - name: Drop staging dirs before upload
        run: |
          # Everything is already inside the zip; the uncompressed staging tree
          # would otherwise double the upload.
          root='${{ steps.scratch.outputs.root }}'
          find "$root/images" -mindepth 1 -maxdepth 1 -type d -exec sudo rm -rf {} +
          ls -lh "$root/images"

      - name: Upload image zip
        uses: actions/upload-artifact@v4
        with:
          name: endeavouros-pipa-${{ inputs.desktop }}
          path: ${{ steps.scratch.outputs.root }}/images/*.zip
          retention-days: ${{ inputs.retention_days }}
          # The zip is already deflated; recompressing wastes minutes.
          compression-level: 0
          if-no-files-found: error

      - name: Diagnostics on failure
        if: failure()
        run: |
          df -hT || true
          docker info || true
          ls -lhR '${{ steps.scratch.outputs.root }}/images' 2>/dev/null | head -50 || true
